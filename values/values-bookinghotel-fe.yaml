name: bookinghotel-fe
#113
applabels: bookinghotel-fe
#=====================
# DEPLOYMENT
#=====================
deployment:
  enabled: true
  image:
    name: bookinghotel-fe-container
    repository: bookinghotel_fe
    tag: "03"
    port: 120

  resources:
    enabled: false
    request:
      memory: 64Mi
      cpu: 250m
    limit:
      memory: 128Mi
      cpu: 500m

#======================
# SERVICE
#=====================
service:
  enabled: true

#======================
# INGRESS
#=====================
ingress:
  enabled: true
  domain: ""
  path: "/"

route:
  enabled: false

#======================
# CONFIGMAP
#=====================

configmap:
  enabled: false
#   nameConfigMap: orderservice-be-application-propertie-configmap
#   data:
#     server.port: "${PORT_SERVICE}"
#     spring.application.name: "${NAME_SERVICE}"

#======================
# VOLUMES AND MOUNTVOLUMES
#======================
volumeMounts:
  enabled: false

volumes:
  enabled: false


#======================
# SECRETS
#======================
secret:
  enabled: true
  portService: 80
  portTarget: 80

env:
  enabled: true
  0:
    name: DB_HOST
    valueFrom:
      secretKeyRef:
        name: confighostdatabase-secret
        key: DB_HOST
        optional: false
  1:
    name: DB_USER
    valueFrom:
      secretKeyRef:
        name: confighostdatabase-secret
        key: DB_USER
        optional: false
  2:
    name: DB_PASS
    valueFrom:
      secretKeyRef:
        name: confighostdatabase-secret
        key: DB_PASS
        optional: false
  3:
    name: DB_NAME
    valueFrom:
      secretKeyRef:
        name: confighostdatabase-secret
        key: DB_NAME
        optional: false
  4:
    name: DB_PORT
    valueFrom:
      secretKeyRef:
        name: confighostdatabase-secret
        key: DB_PORT
        optional: false
extraSecrets:
  enabled: false
#======================
# PVC
#======================
pvc:
  enabled: false

