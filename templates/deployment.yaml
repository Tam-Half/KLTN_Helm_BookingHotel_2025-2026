{{- if .Values.deployment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-deployment
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
{{ include "common.labels" . | nindent 6 }}

  template:
    metadata:
      labels:
{{ include "common.labels" . | nindent 8 }}

    spec:
      containers:
        - name: {{ .Values.deployment.image.name }}
          image: tamtran0210/{{ .Values.deployment.image.repository }}:{{ .Values.deployment.image.tag }}
          ports:
            - containerPort: {{ .Values.deployment.image.port }}

{{- if or .Values.secret.enabled .Values.extraSecrets.enabled }}
          envFrom:
{{- if .Values.secret.enabled }}
            - secretRef:
                name: {{ include "mychart.secretName" . }}-secret
                optional: false
{{- end }}

{{- if .Values.extraSecrets.enabled }}
{{- range .Values.extraSecrets.items }}
            - secretRef:
                name: {{ .name }}
{{- end }}
{{- end }}
{{- end }}

{{- if .Values.env.enabled }}
          env:
{{- range .Values.env.items }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .valueFrom.secretKeyRef.name }}
                  key: {{ .valueFrom.secretKeyRef.key }}
                  optional: {{ .valueFrom.secretKeyRef.optional | default false }}
{{- end }}
{{- end }}

{{- if .Values.deployment.resources.enabled }}
          resources:
{{- if .Values.resources.request }}
            requests:
              memory: "{{ .Values.deployment.resources.request.memory }}"
              cpu: "{{ .Values.deployment.resources.request.cpu }}"
{{- end }}
{{- if .Values.deployment.resources.limit }}
            limits:
              memory: "{{ .Values.deployment.resources.limit.memory }}"
              cpu: "{{ .Values.deployment.resources.limit.cpu }}"
{{- end }}
{{- end }}

{{- if .Values.volumeMounts.enabled }}
          volumeMounts:
{{ toYaml .Values.volumeMounts.items | nindent 12 }}
{{- end }}

{{- if .Values.volumes.enabled }}
      volumes:
{{ toYaml .Values.volumes.items | nindent 8 }}
{{- end }}

{{- end }}