{{- if .Values.configmap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-configmap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mychart.labels" . | nindent 4 }}
data:
  env.js: |
{{- if not .Values.configmap.data }}
    window.__ENV__ = {
      API_URL: "{{ .Values.data. }}"
    };
{{- end }}
{{- end }}